version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /.github/release
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /extensions/Shirubasoft.Aspire.Extensions.TigerBeetle/samples/TigerBeetle.TypeScript
      - /extensions/Shirubasoft.Aspire.Extensions.TigerBeetle/samples/TigerBeetle.TypeScript/client
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      tiger-beetle-samples:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
