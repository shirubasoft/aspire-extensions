# actionlint 1.7.12 predates GitHub's reusable workflow identity properties.
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
paths:
  .github/workflows/_extension-publish.yml:
    ignore:
      - '^property "(workflow_sha|workflow_repository)" is not defined in object type \{check_run_id: number; container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}$'
