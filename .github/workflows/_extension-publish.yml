name: Publish extension

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      package_id:
        required: true
        type: string
      initial_version:
        default: 0.0.0
        required: false
        type: string
      release_config:
        required: true
        type: string
      tag_prefix:
        required: true
        type: string
      workflow_run_id:
        required: true
        type: number
    secrets:
      NUGET_API_KEY:
        required: false

concurrency:
  group: publish-${{ inputs.package_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Verify the caller's CI run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_RUN_ID: ${{ inputs.workflow_run_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$EVENT_NAME" == "workflow_run" ]] || fail "This workflow publishes only from a workflow_run event, not '$EVENT_NAME'."
          [[ "$RUN_EVENT" == "push" ]] || fail "The CI run was triggered by '$RUN_EVENT', not push."
          [[ "$RUN_HEAD_BRANCH" == "main" ]] || fail "The CI run was for branch '$RUN_HEAD_BRANCH', not main."
          [[ "$RUN_HEAD_REPOSITORY" == "$REPOSITORY" ]] || fail "The CI run came from '$RUN_HEAD_REPOSITORY', not $REPOSITORY."
          [[ "$RUN_CONCLUSION" == "success" ]] || fail "The CI run concluded with '$RUN_CONCLUSION', not success."
          [[ "$INPUT_HEAD_SHA" == "$RUN_HEAD_SHA" ]] || fail "head_sha '$INPUT_HEAD_SHA' is not the CI run's head SHA '$RUN_HEAD_SHA'."
          [[ "$INPUT_RUN_ID" == "$RUN_ID" ]] || fail "workflow_run_id '$INPUT_RUN_ID' is not the CI run's id '$RUN_ID'."

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Switch to the release commit after verifying it is on main
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head_sha must be a full commit SHA, got '$HEAD_SHA'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HEAD_SHA" refs/remotes/origin/main; then
            echo "::error::Commit $HEAD_SHA is not on main. Refusing to run release tooling from it."
            exit 1
          fi
          git checkout --detach "$HEAD_SHA"

      - name: Check out release tooling from this workflow's commit
        shell: bash
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "::error::Release tooling must come from $REPOSITORY, got '$WORKFLOW_REPOSITORY'."
            exit 1
          fi
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::workflow_sha must be a full commit SHA, got '$WORKFLOW_SHA'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$WORKFLOW_SHA" refs/remotes/origin/main; then
            echo "::error::Workflow commit $WORKFLOW_SHA is not on main. Refusing to run release tooling from it."
            exit 1
          fi
          # Keep semantic-release's cwd and history at head_sha while loading co-located tooling.
          git worktree add --detach "$RUNNER_TEMP/release-tooling" "$WORKFLOW_SHA"
          echo "RELEASE_TOOLING_DIR=$RUNNER_TEMP/release-tooling" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download packages from CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/${{ inputs.package_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.workflow_run_id }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install locked release tooling
        run: npm ci --prefix "$RELEASE_TOOLING_DIR/.github/release"

      - name: Bootstrap the package version baseline
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
        run: |
          set -euo pipefail
          if ! git describe --tags --abbrev=0 --match "$TAG_PREFIX-v[0-9]*" >/dev/null 2>&1; then
            git tag "$TAG_PREFIX-v$INITIAL_VERSION" "$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

      - name: Remove the tag left by an earlier unpublished attempt of this release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PACKAGE_ID: ${{ inputs.package_id }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: >-
          node "$RELEASE_TOOLING_DIR/.github/release/remove-incomplete-release-tag.mjs"
          "$TAG_PREFIX" "$PACKAGE_ID" "$HEAD_SHA"

      - name: Version and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_CONFIG: ${{ inputs.release_config }}
        run: >-
          "$RELEASE_TOOLING_DIR/.github/release/node_modules/.bin/semantic-release"
          --extends "$RELEASE_TOOLING_DIR/$RELEASE_CONFIG"
