name: Publish extension

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      package_id:
        required: true
        type: string
      initial_version:
        default: 0.0.0
        required: false
        type: string
      release_config:
        required: true
        type: string
      tag_prefix:
        required: true
        type: string
      workflow_run_id:
        required: true
        type: number
    secrets:
      NUGET_API_KEY:
        required: false

concurrency:
  group: publish-${{ inputs.package_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Switch to the release commit after verifying it is on main
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head_sha must be a full commit SHA, got '$HEAD_SHA'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HEAD_SHA" refs/remotes/origin/main; then
            echo "::error::Commit $HEAD_SHA is not on main. Refusing to run release tooling from it."
            exit 1
          fi
          git checkout --detach "$HEAD_SHA"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download packages from CI
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/${{ inputs.package_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.workflow_run_id }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked release tooling
        run: npm ci --prefix .github/release

      - name: Bootstrap the package version baseline
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
        run: |
          set -euo pipefail
          if ! git describe --tags --abbrev=0 --match "$TAG_PREFIX-v[0-9]*" >/dev/null 2>&1; then
            git tag "$TAG_PREFIX-v$INITIAL_VERSION" "$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

      - name: Version and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_CONFIG: ${{ inputs.release_config }}
        run: .github/release/node_modules/.bin/semantic-release --extends "$RELEASE_CONFIG"
