name: Resource Groups CI

on:
  push:
    branches:
      - main
    paths:
      - extensions/Shirubasoft.Aspire.Extensions.ResourceGroups/**
      - .github/release/**
      - .github/workflows/_extension-ci.yml
      - .github/workflows/_extension-prerelease.yml
      - .github/workflows/_extension-publish.yml
      - .github/workflows/aspire-update.yml
      - .github/workflows/resource-groups-ci.yml
      - .github/workflows/resource-groups-prerelease.yml
      - .github/workflows/resource-groups-publish.yml
      - .config/dotnet-tools.json
      - .editorconfig
      - Directory.Build.props
      - Directory.Packages.props
      - Aspire.Extensions.Tools.slnx
      - build.ps1
      - build.sh
      - eng/**
      - global.json
      - tests/CrapScore.Tests/**
      - tools/CrapScore/**
  pull_request:
    paths:
      - extensions/Shirubasoft.Aspire.Extensions.ResourceGroups/**
      - .github/release/**
      - .github/workflows/_extension-ci.yml
      - .github/workflows/_extension-prerelease.yml
      - .github/workflows/_extension-publish.yml
      - .github/workflows/aspire-update.yml
      - .github/workflows/resource-groups-ci.yml
      - .github/workflows/resource-groups-prerelease.yml
      - .github/workflows/resource-groups-publish.yml
      - .config/dotnet-tools.json
      - .editorconfig
      - Directory.Build.props
      - Directory.Packages.props
      - Aspire.Extensions.Tools.slnx
      - build.ps1
      - build.sh
      - eng/**
      - global.json
      - tests/CrapScore.Tests/**
      - tools/CrapScore/**
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  resource-groups:
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/_extension-ci.yml
    with:
      artifact_name: resource-groups-nuget-packages
      extension_path: extensions/Shirubasoft.Aspire.Extensions.ResourceGroups
      package_id: Shirubasoft.Aspire.Extensions.ResourceGroups
      release_config: ./extensions/Shirubasoft.Aspire.Extensions.ResourceGroups/release.config.mjs
      tag_prefix: resource-groups
