name: Test Diagnostics CI

on:
  push:
    branches:
      - main
    paths:
      - extensions/Shirubasoft.Aspire.Extensions.TestDiagnostics/**
      - .github/release/**
      - .github/workflows/_extension-ci.yml
      - .github/workflows/_extension-prerelease.yml
      - .github/workflows/_extension-publish.yml
      - .github/workflows/aspire-update.yml
      - .github/workflows/test-diagnostics-ci.yml
      - .github/workflows/test-diagnostics-prerelease.yml
      - .github/workflows/test-diagnostics-publish.yml
      - .config/dotnet-tools.json
      - .editorconfig
      - Directory.Build.props
      - Directory.Packages.props
      - Aspire.Extensions.Tools.slnx
      - build.ps1
      - build.sh
      - eng/**
      - global.json
      - tests/CrapScore.Tests/**
      - tools/CrapScore/**
  pull_request:
    paths:
      - extensions/Shirubasoft.Aspire.Extensions.TestDiagnostics/**
      - .github/release/**
      - .github/workflows/_extension-ci.yml
      - .github/workflows/_extension-prerelease.yml
      - .github/workflows/_extension-publish.yml
      - .github/workflows/aspire-update.yml
      - .github/workflows/test-diagnostics-ci.yml
      - .github/workflows/test-diagnostics-prerelease.yml
      - .github/workflows/test-diagnostics-publish.yml
      - .config/dotnet-tools.json
      - .editorconfig
      - Directory.Build.props
      - Directory.Packages.props
      - Aspire.Extensions.Tools.slnx
      - build.ps1
      - build.sh
      - eng/**
      - global.json
      - tests/CrapScore.Tests/**
      - tools/CrapScore/**
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test-diagnostics:
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/_extension-ci.yml
    with:
      artifact_name: test-diagnostics-nuget-packages
      extension_path: extensions/Shirubasoft.Aspire.Extensions.TestDiagnostics
      package_id: Shirubasoft.Aspire.Extensions.TestDiagnostics
      release_config: ./extensions/Shirubasoft.Aspire.Extensions.TestDiagnostics/release.config.mjs
      tag_prefix: test-diagnostics
