name: Publish Cloudflare Tunnels NuGet package

on:
  workflow_run:
    workflows:
      - Cloudflare Tunnels CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/_extension-publish.yml
    with:
      ci_workflow_path: .github/workflows/cloudflare-tunnels-ci.yml
      artifact_name: cloudflare-tunnels-nuget-packages
      head_sha: ${{ github.event.workflow_run.head_sha }}
      initial_version: 1.1.8
      package_id: Shirubasoft.Aspire.CloudflareTunnels
      release_config: ./extensions/Shirubasoft.Aspire.Extensions.CloudflareTunnels/release.config.mjs
      tag_prefix: cloudflare-tunnels
      workflow_run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
