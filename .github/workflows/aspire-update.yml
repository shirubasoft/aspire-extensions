name: Update Aspire dependencies

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: update-aspire-dependencies
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    # The merge step waits for every extension CI workflow, including the end-to-end jobs.
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update Aspire AppHosts and integrations
        id: update
        env:
          ASPIRE_UPDATE_REPORT: ${{ runner.temp }}/aspire-update-pr.md
        run: ./eng/update-aspire.sh "$ASPIRE_UPDATE_REPORT"

      - name: Validate updates
        id: validation
        if: steps.update.outputs.updated == 'true'
        continue-on-error: true
        env:
          ASPIRE_UPDATE_REPORT: ${{ runner.temp }}/aspire-update-pr.md
        run: >-
          ./eng/validate-aspire-update.sh
          "$ASPIRE_UPDATE_REPORT"
          "${{ runner.temp }}/aspire-update-build.log"

      - name: Create or update pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: codex/aspire-updates
          delete-branch: true
          commit-message: 'chore(deps): update Aspire dependencies'
          title: 'chore(deps): update Aspire dependencies'
          body-path: ${{ runner.temp }}/aspire-update-pr.md

      - name: Merge after every extension CI passes on the update branch
        if: >-
          steps.update.outputs.updated == 'true' &&
          steps.validation.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.pull-request-number }}
        run: ./eng/merge-aspire-update.sh "$PULL_REQUEST"

      - name: Fail when validation failed
        if: >-
          steps.update.outputs.updated == 'true' &&
          steps.validation.outcome == 'failure'
        run: exit 1
