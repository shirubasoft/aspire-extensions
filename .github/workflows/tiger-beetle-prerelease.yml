name: Publish TigerBeetle prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet SemVer prerelease version, such as 2.2.0-preview.1
        required: true
        type: string
      confirm_publish:
        description: Publish the generated packages to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: >-
      vars.NUGET_PUBLISH_ENABLED == 'true' &&
      inputs.confirm_publish &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_extension-prerelease.yml
    with:
      artifact_name: tiger-beetle-nuget-prerelease-packages
      extension_path: extensions/Shirubasoft.Aspire.Extensions.TigerBeetle
      package_id: Shirubasoft.Aspire.Hosting.TigerBeetle
      version: ${{ inputs.version }}
    secrets: inherit
